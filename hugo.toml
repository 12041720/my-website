baseURL = 'https://12041720.github.io/my-website/'
relativeURLs = true
languageCode = 'zh-cn'
title = '我的个人主页'
theme = 'PaperMod'

[params]
  env = "production"
  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "你好 👋"
    Content = "欢迎来到我的个人主页！这里记录我的思考、项目和博客文章。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/12041720"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/yourusername"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your@email.com"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "博客"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "项目"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 4

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
